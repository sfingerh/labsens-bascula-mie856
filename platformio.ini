[platformio]
src_dir = firmware/bascula_v4
default_envs = xiao_c6

; Platform: pioarduino espressif32 (Arduino-ESP32 3.x). Needed for seeed_xiao_esp32c6
; and Core 3.x APIs (timerBegin/timerAlarm). Official platformio/espressif32 lags on C6.
; Pin: https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; OneWire API via OneWireNg (provides OneWire.h). Ignore registry OneWire: it fails on
; ESP32-C6 / Arduino-ESP32 3.x (GPIO.*.val). DallasTemperature still works with OneWireNg.
lib_deps =
  robtillaart/HX711@^0.3.9
  pstolarz/OneWireNg@^0.14.0
  milesburton/DallasTemperature@^3.11.0
lib_ignore =
  OneWire

[env:xiao_c6]
board = seeed_xiao_esp32c6

[env:xiao_s3]
board = seeed_xiao_esp32s3
