[platformio]
src_dir = firmware/bascula_v4
default_envs = xiao_c6

; Platform: pioarduino espressif32 (Arduino-ESP32 3.x). Needed for seeed_xiao_esp32c6
; and Core 3.x APIs (timerBegin/timerAlarm). Official platformio/espressif32 lags on C6.
; Pin: https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; OneWire: vendored under lib/OneWire (2.3.8 + patch C6/H2 .val GPIO for Arduino-ESP32 3.x).
; Registry paulstoffregen/OneWire@2.3.8 does not compile on ESP32-C6 with Core 3.x.
lib_deps =
  robtillaart/HX711@^0.3.9
  milesburton/DallasTemperature@^3.11.0

[env:xiao_c6]
board = seeed_xiao_esp32c6

[env:xiao_s3]
board = seeed_xiao_esp32s3
